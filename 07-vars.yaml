- name: print username and password
  hosts: local
  connecttion: local
  vars_prompt:
  - name: username
    prompt: Please
    private: false

  - name: password
    prompt: please enter your password
    private: true

  tasks:
  - name: print info
    ansible.builtin.debug:
     msg: "username is: {{ username }}, password is: {{ password }}"    